<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardmarket Tracker</title>
    
    <!-- 🎨 ICONA DELL'APP (Usa la tua immagine su GitHub) -->
    <link rel="apple-touch-icon" href="senza titolo.jpg">
    <link rel="icon" type="image/jpeg" href="senza titolo.jpg">

    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --text: #f3f4f6;
            --text-secondary: #9ca3af;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            background-color: #2b2b2b;
            color: white;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        button:active { opacity: 0.8; }

        ul { list-style: none; padding: 0; margin: 0; }

        li {
            background-color: #2b2b2b;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .img-container {
            position: relative;
            cursor: pointer;
        }

        .prod-img {
            width: 65px;
            height: 65px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #374151;
            flex-shrink: 0;
            border: 1px solid #4b5563;
        }

        .info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .nome {
            font-weight: bold;
            font-size: 0.95rem;
            word-break: break-word;
        }

        .badge {
            display: inline-block;
            background-color: #374151;
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            width: fit-content;
        }

        .price-tag {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--success);
            margin-top: 2px;
        }

        .date-tag {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .btn-open {
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            text-align: center;
        }

        .btn-edit {
            background-color: #10b981;
            color: white;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            border: none;
        }

        .btn-img {
            background-color: #8b5cf6;
            color: white;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            border: none;
        }

        .btn-delete {
            background-color: var(--danger);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎴 Cardmarket Tracker</h1>

        <div class="card">
            <div class="form-group">
                <input type="text" id="urlInput" placeholder="Link Cardmarket *" />
                <input type="number" step="0.01" id="priceInput" placeholder="Prezzo € (opzionale)" />
                <button onclick="aggiungiProdotto()">➕ Salva Prodotto</button>
            </div>
        </div>

        <div class="card">
            <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 12px;">
                <span style="font-weight:bold;">I tuoi Prodotti</span>
                <span id="count" class="badge">0</span>
            </div>
            <ul id="listaProdotti"></ul>
        </div>
    </div>

    <script>
        function bypassaBloccoImmagine(url) {
            if (!url) return "senza titolo.jpg";
            if (url.startsWith("data:image")) return url;
            
            if (url.includes("cardmarket") || url.includes("s3")) {
                const urlPulito = url.replace(/^https?:\/\//, '');
                return `https://images.weserv.nl/?url=${encodeURIComponent(urlPulito)}&w=150&h=150&fit=cover`;
            }
            return url;
        }

        function caricaProdotti() {
            const prodotti = JSON.parse(localStorage.getItem("cm_tracker_links_v2")) || [];
            const listaElem = document.getElementById("listaProdotti");
            document.getElementById("count").innerText = prodotti.length;
            listaElem.innerHTML = "";

            if (prodotti.length === 0) {
                listaElem.innerHTML = "<p style='color: var(--text-secondary); text-align:center;'>Nessun prodotto salvato.</p>";
                return;
            }

            prodotti.forEach((item, index) => {
                const li = document.createElement("li");
                const imgUrl = bypassaBloccoImmagine(item.immagine);

                li.innerHTML = `
                    <div class="img-container" onclick="gestisciImmagine(${index})">
                        <img src="${imgUrl}" class="prod-img" alt="Foto" onerror="this.src='senza titolo.jpg'">
                    </div>
                    
                    <div class="info">
                        <span class="nome">${item.nome}</span>
                        <div><span class="badge">${item.lingua}</span></div>
                        <div class="price-tag">${item.prezzo ? item.prezzo + ' €' : 'Prezzo N/D'}</div>
                        <div class="date-tag">${item.data ? 'Agg: ' + item.data : 'Mai aggiornato'}</div>
                    </div>

                    <div class="actions">
                        <a href="${item.url}" target="_blank" class="btn-open">🔍 Apri</a>
                        <button class="btn-edit" onclick="aggiornaPrezzo(${index})">💶 Prezzo</button>
                        <button class="btn-img" onclick="gestisciImmagine(${index})">📋 Foto</button>
                        <button class="btn-delete" onclick="rimuoviProdotto(${index})">🗑️</button>
                    </div>
                `;
                listaElem.appendChild(li);
            });
        }

        function estraiDatiUrl(url) {
            try {
                const matchLang = url.match(/language=(\d+)/);
                const langCode = matchLang ? matchLang[1] : "1";
                const linguaMap = {"1": "EN", "2": "FR", "3": "DE", "4": "ES", "5": "IT"};
                const lingua = linguaMap[langCode] || "EN";

                const pathParts = new URL(url).pathname.split('/');
                const slug = pathParts[pathParts.length - 1];
                const nome = slug.replace(/-/g, ' ');

                return { nome, lingua };
            } catch (e) {
                return { nome: "Prodotto Cardmarket", lingua: "EN" };
            }
        }

        function ottieniDataOraAttuale() {
            const ora = new Date();
            const giorno = String(ora.getDate()).padStart(2, '0');
            const mese = String(ora.getMonth() + 1).padStart(2, '0');
            const ore = String(ora.getHours()).padStart(2, '0');
            const minuti = String(ora.getMinutes()).padStart(2, '0');
            return `${giorno}/${mese} ore ${ore}:${minuti}`;
        }

        function aggiungiProdotto() {
            const urlInput = document.getElementById("urlInput");
            const priceInput = document.getElementById("priceInput");

            const url = urlInput.value.trim();
            if (!url) {
                alert("Incolla l'URL del prodotto!");
                return;
            }

            const { nome, lingua } = estraiDatiUrl(url);
            const prezzo = priceInput.value ? parseFloat(priceInput.value).toFixed(2) : null;
            const data = prezzo ? ottieniDataOraAttuale() : null;

            const prodotti = JSON.parse(localStorage.getItem("cm_tracker_links_v2")) || [];
            prodotti.push({ nome, lingua, url, prezzo, data, immagine: null });
            localStorage.setItem("cm_tracker_links_v2", JSON.stringify(prodotti));

            urlInput.value = "";
            priceInput.value = "";
            caricaProdotti();
        }

        function aggiornaPrezzo(index) {
            const prodotti = JSON.parse(localStorage.getItem("cm_tracker_links_v2")) || [];
            const nuovoPrezzo = prompt("Nuovo prezzo in €:", prodotti[index].prezzo || "");

            if (nuovoPrezzo !== null && nuovoPrezzo.trim() !== "") {
                prodotti[index].prezzo = parseFloat(nuovoPrezzo.replace(',', '.')).toFixed(2);
                prodotti[index].data = ottieniDataOraAttuale();
                localStorage.setItem("cm_tracker_links_v2", JSON.stringify(prodotti));
                caricaProdotti();
            }
        }

        async function gestisciImmagine(index) {
            try {
                const clipboardItems = await navigator.clipboard.read();
                for (const item of clipboardItems) {
                    for (const type of item.types) {
                        if (type.startsWith('image/')) {
                            const blob = await item.getType(type);
                            ridimensionaESalvaImmagine(blob, index);
                            return;
                        }
                    }
                }
            } catch (err) {
                console.log("Ricorro al prompt:", err);
            }

            const prodotti = JSON.parse(localStorage.getItem("cm_tracker_links_v2")) || [];
            const urlImg = prompt("Incolla URL dell'immagine (oppure copia la foto negli appunti prima di cliccare):", prodotti[index].immagine || "");
            if (urlImg !== null) {
                prodotti[index].immagine = urlImg.trim();
                localStorage.setItem("cm_tracker_links_v2", JSON.stringify(prodotti));
                caricaProdotti();
            }
        }

        function ridimensionaESalvaImmagine(fileBlob, index) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 120;
                    canvas.height = 120;
                    ctx.drawImage(img, 0, 0, 120, 120);
                    
                    const base64Image = canvas.toDataURL('image/jpeg', 0.8);
                    
                    const prodotti = JSON.parse(localStorage.getItem("cm_tracker_links_v2")) || [];
                    prodotti[index].immagine = base64Image;
                    localStorage.setItem("cm_tracker_links_v2", JSON.stringify(prodotti));
                    caricaProdotti();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(fileBlob);
        }

        function rimuoviProdotto(index) {
            if (confirm("Rimuovere questo elemento?")) {
                const prodotti = JSON.parse(localStorage.getItem("cm_tracker_links_v2")) || [];
                prodotti.splice(index, 1);
                localStorage.setItem("cm_tracker_links_v2", JSON.stringify(prodotti));
                caricaProdotti();
            }
        }

        caricaProdotti();
    </script>
</body>
</html>
